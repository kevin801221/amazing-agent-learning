<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Amazing Agent Learning</title>
  <desc id="desc">Build agents. Understand every step. A learning path from the core loop to tools and evaluation.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23313d" stroke-width="1"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1320"/><stop offset="1" stop-color="#122d32"/></linearGradient>
  </defs>
  <rect width="1280" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="460" rx="24" fill="url(#grid)" opacity="0.5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="54" width="8" height="8" rx="2" fill="#83f6c7"/>
    <text x="78" y="64" fill="#83f6c7" font-size="16" font-weight="700" letter-spacing="3">AMAZING AGENT LEARNING</text>
    <text x="56" y="159" fill="#f4f8fc" font-size="70" font-weight="700" letter-spacing="-3">Build agents.</text>
    <text x="56" y="215" fill="#f4f8fc" font-size="38" font-weight="700" letter-spacing="-1">Understand every step.</text>
    <text x="58" y="269" fill="#aabfc8" font-size="19">From your first agent loop to real-world systems.</text>
    <g font-size="13" font-weight="700" letter-spacing="1">
      <rect x="56" y="312" width="166" height="36" rx="18" fill="#1c363b" stroke="#355258"/>
      <text x="139" y="335" fill="#b5f8e0" text-anchor="middle">LEARN THE CORE</text>
      <rect x="234" y="312" width="176" height="36" rx="18" fill="#1c363b" stroke="#355258"/>
      <text x="322" y="335" fill="#b5f8e0" text-anchor="middle">BUILD WITH TOOLS</text>
      <rect x="422" y="312" width="168" height="36" rx="18" fill="#1c363b" stroke="#355258"/>
      <text x="506" y="335" fill="#b5f8e0" text-anchor="middle">SHIP WITH EVALS</text>
    </g>
    <text x="58" y="400" fill="#91aab7" font-size="14" letter-spacing="1">CURATED RESOURCES / PRACTICAL ROADMAP / COMMUNITY</text>
    <rect x="790" y="48" width="438" height="364" rx="20" fill="#0c1924" stroke="#34525b"/>
    <text x="822" y="83" fill="#aabfc8" font-size="12" font-weight="700" letter-spacing="2">YOUR LEARNING LOOP</text>
    <path d="M 844 151 V 331" fill="none" stroke="#4b8e85" stroke-width="2"/>
    <g>
      <rect x="820" y="110" width="376" height="74" rx="12" fill="#142933" stroke="#294651"/>
      <circle cx="845" cy="147" r="6" fill="#83f6c7"/>
      <text x="865" y="141" fill="#e9f5f3" font-size="19" font-weight="700">01 / UNDERSTAND</text>
      <text x="865" y="164" fill="#aabfc8" font-size="14">Models, context, decisions</text>
      <rect x="820" y="202" width="376" height="74" rx="12" fill="#142933" stroke="#294651"/>
      <circle cx="845" cy="239" r="6" fill="#83f6c7"/>
      <text x="865" y="233" fill="#e9f5f3" font-size="19" font-weight="700">02 / BUILD</text>
      <text x="865" y="256" fill="#aabfc8" font-size="14">Tools, workflows, memory</text>
      <rect x="820" y="294" width="376" height="74" rx="12" fill="#142933" stroke="#294651"/>
      <circle cx="845" cy="331" r="6" fill="#83f6c7"/>
      <text x="865" y="325" fill="#e9f5f3" font-size="19" font-weight="700">03 / EVALUATE</text>
      <text x="865" y="348" fill="#aabfc8" font-size="14">Trace, measure, improve</text>
    </g>
  </g>
</svg>
